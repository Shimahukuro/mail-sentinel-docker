services:
  greenmail:
    image: greenmail/standalone:2.1.13
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:greenmail@test.local
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - mail-sentinel

  roundcube:
    image: roundcube/roundcubemail:1.7.3-apache
    depends_on:
      greenmail:
        condition: service_healthy
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    ports:
      - "127.0.0.1:8081:80"
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mail-sentinel

  greenmail-setup:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      greenmail:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/usr/local/bin/mail-sentinel-supervisor", "--setup"]
    environment:
      MAIL_SENTINEL_ACCOUNTS_FILE: /etc/mail-sentinel/accounts.json
      STATE_DIR: /var/lib/mail-sentinel-state
    secrets:
      - imap_password
    volumes:
      - ./tests/greenmail/accounts.json:/etc/mail-sentinel/accounts.json:ro
      - mail-sentinel-state:/var/lib/mail-sentinel-state
    tmpfs:
      - /tmp:size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mail-sentinel

  worker:
    depends_on:
      greenmail:
        condition: service_healthy
      greenmail-setup:
        condition: service_completed_successfully
      spamassassin:
        condition: service_healthy
    secrets:
      - imap_password
    volumes:
      - ./tests/greenmail/accounts.json:/etc/mail-sentinel/accounts.json:ro

  admin:
    depends_on:
      greenmail:
        condition: service_healthy
      greenmail-setup:
        condition: service_completed_successfully
      spamassassin:
        condition: service_healthy
    secrets:
      - imap_password
    volumes:
      - ./tests/greenmail/accounts.json:/etc/mail-sentinel/accounts.json:ro

secrets:
  imap_password:
    file: ./tests/greenmail/imap_password
