services:
  greenmail:
    image: greenmail/standalone:2.1.12
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:greenmail@test.local
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - mail-sentinel

  roundcube:
    image: roundcube/roundcubemail:1.7.3-apache
    depends_on:
      greenmail:
        condition: service_healthy
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: greenmail
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: greenmail
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    ports:
      - "127.0.0.1:8081:80"
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mail-sentinel

  worker:
    depends_on:
      greenmail:
        condition: service_healthy
      spamassassin:
        condition: service_healthy
    environment:
      IMAP_HOST: greenmail
      IMAP_PORT: 3143
      IMAP_TLS_MODE: none
      IMAP_USERNAME: test@test.local
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
      IMAP_INBOX: INBOX
      IMAP_JUNK: Junk
      POLL_INTERVAL_SECONDS: 5
      BATCH_SIZE: 25
      LOOKBACK_DAYS: 1
      IMAP_TIMEOUT_SECONDS: 10
      SPAMC_MAX_SIZE_BYTES: 10485760
      PROCESSED_FLAG: MailSentinelChecked
      CREATE_MISSING_FOLDERS: "true"
    secrets:
      - imap_password

secrets:
  imap_password:
    file: ./tests/greenmail/imap_password
