name: mail-sentinel

services:
  spamassassin:
    build:
      context: ./spamassassin
    restart: unless-stopped
    expose:
      - "783"
    volumes:
      - spamassassin-data:/var/lib/mail-sentinel
      - spamassassin-rules:/var/lib/spamassassin
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=1m,mode=0755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sa-check_spamd", "--hostname=127.0.0.1", "--port=783"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mail-sentinel

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      spamassassin:
        condition: service_healthy
    environment:
      MAIL_SENTINEL_ACCOUNTS_FILE: /etc/mail-sentinel/accounts.json
      STATE_DIR: /var/lib/mail-sentinel-state
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - mail-sentinel-state:/var/lib/mail-sentinel-state
      - ./config/accounts.json:/etc/mail-sentinel/accounts.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail-sentinel

  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: admin/Dockerfile
    depends_on:
      spamassassin:
        condition: service_healthy
    environment:
      MAIL_SENTINEL_ACCOUNTS_FILE: /etc/mail-sentinel/accounts.json
      SPAMD_HOST: spamassassin
      SPAMD_PORT: 783
      STATE_DIR: /var/lib/mail-sentinel-state
    volumes:
      - mail-sentinel-state:/var/lib/mail-sentinel-state
      - spamassassin-rules:/var/lib/spamassassin:ro
      - ./config/accounts.json:/etc/mail-sentinel/accounts.json:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mail-sentinel

  maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: admin/Dockerfile
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/mail-sentinel-maintenance"]
    # Backup/restore must preserve files that can have restrictive ownership.
    # This opt-in container receives only filesystem-maintenance capabilities.
    user: "0:0"
    volumes:
      - spamassassin-data:/data/spamassassin-data
      - spamassassin-rules:/data/spamassassin-rules
      - mail-sentinel-state:/data/mail-sentinel-state
      - ./backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
    security_opt:
      - no-new-privileges:true

volumes:
  spamassassin-data:
  spamassassin-rules:
  mail-sentinel-state:

networks:
  mail-sentinel:
    internal: false
